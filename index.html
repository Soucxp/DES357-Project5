<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

      <!-- ICON 1: GIFT -->
      <a-marker type="pattern" url="assets/icon1.patt">
        <a-entity position="0 0.4 0"
                  rotation="-90 0 0"
                  animation__scale="property: scale; from: 0.8 0.8 0.8; to: 1.05 1.05 1.05; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
          <a-plane width="2.4" height="1.3" color="#141418" opacity="0.88"></a-plane>
          <a-plane width="2.48" height="1.38" color="#FFD166" position="0 0 -0.01"></a-plane>
          <a-text value="A birthday gift from a night I did not know was the last time we would all gather."
                  align="center"
                  color="#FFFFFF"
                  width="2.1"
                  wrap-count="28"
                  position="0 0 0.02">
          </a-text>
        </a-entity>
      </a-marker>

      <!-- ICON 2: CAKE -->
      <a-marker type="pattern" url="assets/icon2.patt">
        <a-entity position="0 0.4 0"
                  rotation="-90 0 0"
                  animation__float="property: position; from: 0 0.35 0; to: 0 0.65 0; dir: alternate; loop: true; dur: 1800; easing: easeInOutQuad">
          <a-plane width="2.4" height="1.3" color="#141418" opacity="0.88"></a-plane>
          <a-plane width="2.48" height="1.38" color="#FF6B6B" position="0 0 -0.01"></a-plane>
          <a-text value="Sharing cake and talking like nothing was changing, even when it was."
                  align="center"
                  color="#FFFFFF"
                  width="2.1"
                  wrap-count="28"
                  position="0 0 0.02">
          </a-text>
        </a-entity>
      </a-marker>

      <!-- ICON 3: BALLOONS -->
      <a-marker type="pattern" url="assets/icon3.patt">
        <a-entity position="0 0.4 0"
                  rotation="-90 0 0"
                  animation__tilt="property: rotation; from: -90 -6 0; to: -90 6 0; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine">
          <a-plane width="2.4" height="1.3" color="#141418" opacity="0.88"></a-plane>
          <a-plane width="2.48" height="1.38" color="#4ECDC4" position="0 0 -0.01"></a-plane>
          <a-text value="Balloons by the door, trying to hold onto people who meant a lot to me."
                  align="center"
                  color="#FFFFFF"
                  width="2.1"
                  wrap-count="28"
                  position="0 0 0.02">
          </a-text>
        </a-entity>
      </a-marker>

      <!-- ICON 4: CANDLE -->
      <a-marker type="pattern" url="assets/icon4.patt">
        <a-entity position="0 0.4 0"
                  rotation="-90 0 0"
                  animation__pulse="property: position; from: 0 0.35 0; to: 0 0.55 0; dir: alternate; loop: true; dur: 2600; easing: easeInOutSine">
          <a-plane width="2.4" height="1.3" color="#141418" opacity="0.88"></a-plane>
          <a-plane width="2.48" height="1.38" color="#A78BFA" position="0 0 -0.01"></a-plane>
          <a-text value="Blowing out the candle and realizing how quiet it feels once everyone leaves."
                  align="center"
                  color="#FFFFFF"
                  width="2.1"
                  wrap-count="28"
                  position="0 0 0.02">
          </a-text>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
